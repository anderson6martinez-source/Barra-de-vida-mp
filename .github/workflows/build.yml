name: Compilar mod multijugador

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verificar DLL
        run: |
          ls -la Libs || true
          for n in Engine EntitySystem Survivalcraft mscorlib System System.Core; do
            test -f Libs/$n.dll || { echo "::error::Falta Libs/$n.dll en el repo"; exit 1; }
          done
      - name: Compilar contra los DLL del juego
        run: |
          LINEA=$(dotnet --list-sdks | tail -1)
          VER=$(echo "$LINEA" | awk '{print $1}')
          DIR=$(echo "$LINEA" | sed 's/.*\[\(.*\)\]/\1/')
          CSC="$DIR/$VER/Roslyn/bincore/csc.dll"
          REFS=""
          for f in Libs/*.dll; do REFS="$REFS -r:$f"; done
          mkdir -p out
          dotnet "$CSC" -nologo -target:library -nostdlib+ -noconfig -langversion:latest -optimize+ -out:out/HealthBars.dll $REFS HealthBars.cs
      - name: Empaquetar .netmod
        run: |
          mkdir pkg
          cp out/HealthBars.dll pkg/
          cp modinfo.json pkg/
          cd pkg && zip -r ../BarraVida_mp.netmod .
      - uses: actions/upload-artifact@v4
        with:
          name: BarraVida_mp
          path: BarraVida_mp.netmod
